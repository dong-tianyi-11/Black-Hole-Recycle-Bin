<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 设置</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c2029;
      --line: #2c3340;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --accent: #e8a54b;
      --accent-dim: #b87a28;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 16px 18px 14px;
      gap: 10px;
      overflow: auto;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    p.hint {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 13px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }
    input:focus, select:focus {
      border-color: var(--accent-dim);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .presets button {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .presets button.active {
      border-color: var(--accent-dim);
      color: var(--accent);
      background: rgba(232, 165, 75, 0.12);
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 6px;
    }
    button.action {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: linear-gradient(180deg, #f0b45a, var(--accent-dim));
      color: #1a1208;
      font-weight: 650;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    button:disabled { opacity: 0.55; cursor: default; }
    button:active:not(:disabled) { transform: translateY(1px); }
    .msg {
      min-height: 1.2em;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.err { color: #ff8e8e; }
    .msg.ok { color: #8fd49a; }
    .preset-hint {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>AI 主题生成设置</h1>
  <p class="hint">兼容国内主流 OpenAI 格式接口。默认推荐 <strong>DeepSeek</strong>（不识图，用文字描述生成）。国内直连 OpenAI / Claude / Gemini 等易被网关拦截；请优先选国内预设。生成前会自动预检，识图失败时会改用文字描述。</p>

  <label>服务商预设
    <div class="presets" id="presets"></div>
  </label>
  <p class="preset-hint" id="presetHint"></p>

  <label>API Key
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
  </label>
  <label>Base URL
    <input id="baseUrl" type="text" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
  </label>
  <label>模型
    <input id="model" type="text" placeholder="deepseek-chat / qwen-vl-max / …" spellcheck="false" />
  </label>
  <div class="msg" id="msg"></div>
  <div class="row">
    <button class="action ghost" id="cancel" type="button">取消</button>
    <button class="action ghost" id="test" type="button">测试连接</button>
    <button class="action primary" id="save" type="button">保存</button>
  </div>
  <script>
    const apiKey = document.getElementById('apiKey');
    const baseUrl = document.getElementById('baseUrl');
    const model = document.getElementById('model');
    const msg = document.getElementById('msg');
    const testBtn = document.getElementById('test');
    const presetsEl = document.getElementById('presets');
    const presetHint = document.getElementById('presetHint');
    let presets = [];
    let activePreset = 'custom';

    function setMsg(text, ok) {
      msg.textContent = text || '';
      msg.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
    }

    function payload() {
      return {
        apiKey: apiKey.value.trim(),
        baseUrl: baseUrl.value.trim(),
        model: model.value.trim(),
      };
    }

    function matchPreset() {
      const b = baseUrl.value.trim().replace(/\/+$/, '');
      const hit = presets.find((p) => p.baseUrl && b === p.baseUrl.replace(/\/+$/, ''));
      activePreset = hit ? hit.id : 'custom';
      [...presetsEl.querySelectorAll('button')].forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.id === activePreset);
      });
      const cur = presets.find((p) => p.id === activePreset);
      presetHint.textContent = cur?.hint || '';
    }

    function applyPreset(p) {
      activePreset = p.id;
      if (p.baseUrl) baseUrl.value = p.baseUrl;
      if (p.model) model.value = p.model;
      [...presetsEl.querySelectorAll('button')].forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.id === p.id);
      });
      presetHint.textContent = p.hint || '';
    }

    function renderPresets() {
      presetsEl.innerHTML = '';
      for (const p of presets) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = p.id;
        btn.textContent = p.label;
        btn.onclick = () => applyPreset(p);
        presetsEl.appendChild(btn);
      }
      matchPreset();
    }

    baseUrl.addEventListener('input', matchPreset);

    (async () => {
      try {
        const cfg = await window.aiSettings.get();
        apiKey.value = cfg.apiKey || '';
        baseUrl.value = cfg.baseUrl || '';
        model.value = cfg.model || '';
        presets = Array.isArray(cfg.presets) ? cfg.presets : [];
        renderPresets();
      } catch (e) {
        setMsg(e.message || String(e), false);
      }
    })();

    document.getElementById('cancel').onclick = () => window.aiSettings.close();
    testBtn.onclick = async () => {
      setMsg('正在测试…', true);
      testBtn.disabled = true;
      try {
        const r = await window.aiSettings.test(payload());
        setMsg(r.message || (r.ok ? '连接成功' : '连接失败'), !!r.ok);
      } catch (e) {
        setMsg(e.message || String(e), false);
      } finally {
        testBtn.disabled = false;
      }
    };
    document.getElementById('save').onclick = async () => {
      setMsg('');
      try {
        await window.aiSettings.save(payload());
        window.aiSettings.close();
      } catch (e) {
        setMsg(e.message || String(e), false);
      }
    };
  </script>
</body>
</html>
