    <circle cx="106" cy="104" r="7" fill="#f0a090" opacity=".65"/>
    <circle cx="160" cy="104" r="7" fill="#f0a090" opacity=".65"/>
    <text x="188" y="56" fill="#e85d4c" font-size="22" font-family="Segoe UI,sans-serif">!</text>
  </g>
</svg>
