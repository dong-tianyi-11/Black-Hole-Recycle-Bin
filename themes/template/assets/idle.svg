      <path d="M200 118 C226 98, 240 78, 232 58" fill="none" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
    </g>
    <ellipse cx="133" cy="138" rx="58" ry="42" fill="#e8c99a"/>
    <ellipse cx="133" cy="148" rx="38" ry="28" fill="#f5e6c8"/>
    <circle cx="133" cy="88" r="48" fill="#e8c99a"/>
    <ellipse cx="133" cy="102" rx="28" ry="22" fill="#f5e6c8"/>
    <g class="ear-l"><ellipse cx="82" cy="52" rx="18" ry="28" fill="#c4a574" transform="rotate(-18 82 52)"/><ellipse cx="84" cy="56" rx="10" ry="16" fill="#f2b8a0" transform="rotate(-18 84 56)"/></g>
    <g class="ear-r"><ellipse cx="184" cy="52" rx="18" ry="28" fill="#c4a574" transform="rotate(18 184 52)"/><ellipse cx="182" cy="56" rx="10" ry="16" fill="#f2b8a0" transform="rotate(18 182 56)"/></g>
    <ellipse cx="112" cy="86" rx="7" ry="9" fill="#2a2218"/>
    <ellipse cx="154" cy="86" rx="7" ry="9" fill="#2a2218"/>
    <circle cx="114" cy="84" r="2.2" fill="#fff"/><circle cx="156" cy="84" r="2.2" fill="#fff"/>
    <ellipse cx="133" cy="102" rx="9" ry="7" fill="#3a2a22"/>
