<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 266 200" width="266" height="200">
  <defs>
    <style>
      .breathe { transform-origin: 133px 140px; animation: breathe 3.2s ease-in-out infinite; }
      @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(2px)} }
      .tail { transform-origin: 198px 118px; animation: wag 0.55s ease-in-out infinite; }
      @keyframes wag { 0%,100%{transform:rotate(-18deg)} 50%{transform:rotate(22deg)} }
      .ear-l { transform-origin: 88px 62px; animation: ear 2.8s ease-in-out infinite; }
      .ear-r { transform-origin: 168px 62px; animation: ear 2.8s ease-in-out infinite 0.2s; }
      @keyframes ear { 0%,100%{transform:rotate(0)} 40%{transform:rotate(-6deg)} 70%{transform:rotate(4deg)} }
    </style>
  </defs>
